<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Gemini Growth Journal</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>Personal Gemini Growth Journal</h1>

      <p id="status">
        Your personal growth journey starts here.
      </p>

      <button id="signInButton">
        Sign in with Google
      </button>

      <div id="userSection" hidden>
        <p>Signed in as:</p>
        <strong id="userName"></strong>
        <p id="userEmail"></p>

        <button id="signOutButton">
          Sign out
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
